# b20-mlip default configuration (CONTRACTS.md section 4; values from SPEC.md).
# Merge order: this file -> `--config` YAMLs -> environment `B20_SECTION__KEY` -> `--set key=value`.
# Every key must exist in b20mlip.config (extra keys are rejected); tests/test_config.py asserts
# that this file equals the model defaults, so change both together.

paths:
  data_dir: data
  runs_dir: runs
  models_dir: models
  dft_dir: dft
  reports_dir: reports

compute:            # Mac: M2 Pro, CPU float64, 6 threads (MPS is unusable for MACE float64)
  threads: 6
  dtype: float64
  device: cpu

cluster:            # discovered by `b20mlip cluster bootstrap` into configs/cluster/tillicum.yaml
  alias: tillicum
  control_path: ~/.ssh/tillicum-cm
  account: null
  partition_cpu: null
  partition_gpu: null
  scratch: null
  modules: []
  qe_cmd: null
  lammps_cmd: null
  micromamba_env: null
  qos: null                              # discovered: the association's DefaultQOS (sacctmgr)
  install_qe: false                      # bootstrap only plans the micromamba QE fallback unless true
  lammps_sha: 4d222cb3ee2a6b14083c778968497bf9e0efc4b4   # ACEsuit/lammps `mace` head, 2026-09-17
  libtorch_cpu_url: https://download.pytorch.org/libtorch/cpu/libtorch-shared-with-deps-2.14.0%2Bcpu.zip
  libtorch_cuda_url: https://download.pytorch.org/libtorch/cu126/libtorch-shared-with-deps-2.14.0%2Bcu126.zip
  resources: {}                          # per-template SLURM defaults, set in the cluster overlay (see configs/cluster/tillicum.yaml)

data:               # SPEC section 4: strain +-6 %, shear +-4 %, rattle <= 0.15 A, EOS +-8 %, NVT 300/600/900 K
  compounds: [FeSi, CoSi, MnSi, FeGe]      # MnGe is a stretch goal added by the data tier if found
  strains: [-0.06, -0.04, -0.02, 0.02, 0.04, 0.06]
  shears: [-0.04, -0.02, 0.02, 0.04]
  rattle_A: 0.15
  eos_pct: 8.0
  temperatures_K: [300.0, 600.0, 900.0]
  force_cap_eVA: 15.0
  omat24_url: https://dl.fbaipublicfiles.com/opencatalystproject/data/omat/251210/omat24_1M_251210.tar.gz
  omat24_sha256: null                      # recorded by `data pull` (2,274,568,000 bytes measured)
  wbm_sample_n: 1000
  wbm_seed: 0

dft:                # QE PBE, SSSP efficiency 1.3.0 (configs/dft/sssp_efficiency_1.3_pbe.json, Materials Cloud
                    # record rcyfm-68h65, retrieved 2026-09-17); cutoffs = SSSP maxima over Fe/Mn/Co/Si/Ge
                    # (Fe 90/1080 Ry, dual 12) until `dft converge` writes qe_<compound>_converged.json
  ecut_ry: 90.0
  ecut_rho: 1080.0
  k_spacing_inv_A: 0.25                    # |b_i|/n_i <= 0.25 1/A, |b_i| includes 2*pi (ASE/VASP KSPACING convention)
  smearing: mv
  degauss_ry: 0.01
  nspin: {FeSi: 1, CoSi: 1, MnSi: 2, FeGe: 2, MnGe: 2}
  starting_magnetization: {Mn: 0.5, Fe: 0.5, Co: 0.0}
  pseudo_dir: pseudos/sssp_efficiency      # cited + md5 in manifests, never redistributed
  pseudo_family: SSSP-efficiency-1.3
  pseudos:                                 # element -> UPF file name (SSSP efficiency 1.3.0 PBE)
    Fe: Fe.pbe-spn-kjpaw_psl.0.2.1.UPF
    Mn: mn_pbe_v1.5.uspp.F.UPF
    Co: Co_pbe_v1.2.uspp.F.UPF
    Si: Si.pbe-n-rrkjus_psl.1.0.0.UPF
    Ge: ge_pbe_v1.4.uspp.F.UPF
  pseudo_md5s:                             # from the SSSP metadata JSON; verified at `cluster bootstrap`
    Fe: e86618425769142926afa95317d90200
    Mn: 82ef2b46521d7a7d9e736dc3972e4928
    Co: 5f91765df6ddd3222702df6e7b74a16d
    Si: 0b0bb1205258b0d07b9f9672cf965d36
    Ge: 9c9eaa91e581c3f09632fb3098b2c6b2
  sssp_json: configs/dft/sssp_efficiency_1.3_pbe.json
  conv_thr: 1.0e-8
  mixing_beta: 0.4
  electron_maxstep: 100
  branch_tol_muB: 0.3
  m_ref_muB: {}                            # compound -> reference moment per TM atom (muB); empty = branch_ok unknown
  noise_floor_n: 20
  isolated_atom_box_A: 12.0                # E0s: one spin-polarised atom per cubic box, Gamma only
  converge_ecuts_ry: [40.0, 50.0, 60.0, 70.0, 80.0, 90.0]
  converge_k_spacings: [0.35, 0.3, 0.25, 0.2]
  thresholds:
    E_meV_atom: 1.0
    F_meV_A: 5.0

train:              # B1 naive lr from a {1e-4,3e-4,1e-3} sweep; B2 replay lr 1e-4 (this default)
  foundation: medium-mpa-0
  lr: 1.0e-4
  epochs: 30
  batch_size: 4
  energy_weight: 1.0
  forces_weight: 100.0
  stress_weight: 1.0
  ema_decay: 0.99
  replay:
    pt_train_file: mp
    num_samples_pt: 10000
    subselect_pt: fps
  e0s_file: configs/dft/E0s_qe.json
  scratch:
    hidden_irreps: 64x0e+64x1o
    r_max: 5.0
  loss: universal      # mace_run_train --loss (Huber E/F/stress; forced by MACE for replay anyway)
  extra_args: []       # extra mace_run_train flags appended verbatim (tiny CI architecture in tests)

eval:
  bootstrap_n: 2000
  bootstrap_seed: 0
  fmax: 0.05
  max_steps: 500
  offset_residual_gate_meV: 20.0

md:
  timestep_fs: 2.0
  friction: 0.01     # ASE Langevin friction, 1/fs
  taut: 100.0        # fs (ASE NPT thermostat time constant; LAMMPS uses 100*dt)
  taup: 1000.0       # fs (ASE NPT barostat time constant, pfactor = taup^2 * B; LAMMPS uses 1000*dt)
  equil_ps: 10.0     # excluded from every average (a(T), drift, VDOS, RDF)
  natoms: 64         # default supercell size (8-atom B20 cell -> 2x2x2); `md lammps` asks for 512
  bulk_modulus_GPa: 150.0   # barostat pfactor only (B20 silicides ~150-200 GPa); never a result
  thermo_every_steps: 10    # thermo.csv / LAMMPS `thermo N`
  dump_every_steps: 100     # .traj / LAMMPS dump interval
  vdos_every_steps: 5       # velocity sampling for the VDOS (10 fs at 2 fs steps)
  rdf_rmax_A: 6.0           # clipped to half the smallest cell height
  rdf_nbins: 200

sampling:
  k_eVA2: 5.0
  windows: 12
  ps_per_window: 15.0
  T: 300.0

agent:              # CI never constructs an anthropic client: backend=mock unless ANTHROPIC_API_KEY is set
  backend: mock
  model_id: claude-opus-5
  budget:
    max_calls: 25
    max_wall_s: 1800
    max_dft_frames: 200
    max_node_hours: 10
    max_atoms: 512
    max_md_ps: 20
    approve_cluster: false
  trace_dir: runs/agent/traces            # recorded traces <task_id>.jsonl (`agent run --record`; replayed by --backend mock)
  tasks_path: evals/agent_tasks.jsonl     # the 12-task eval (gold recomputed by `b20mlip screen`)
  refs_dir: evals/refs                    # phonons_<compound>_<label>.json references for compare_phonons
  phonon_supercell: [2, 2, 2]             # `phonons` tool default when the caller passes []
  phonon_distance: 0.03                   # A; `phonons` tool default when the caller passes 0
  max_tokens: 16000                       # per-turn output cap of the anthropic backend

report:
  numbers_path: reports/numbers.json

bench:              # Day-1 timing task (SPEC section 15); the CLI takes only --out, so set knobs with --set bench.<key>=<value>
  model: null                     # MACE .model to time; null = the foundation named by train.foundation
  tiers: a,b,c,d,e                # a fine-tune epoch, b MD, c WBM relaxations, d phonons, e forward+backward RSS
  quick: false                    # scale every size down (tiny CI model): 8+5 frames, 20 MD steps, 2 relaxations, 1x1x1 phonons
  force: false                    # re-measure sub-tasks already cached in <out>/bench.json
  compound: FeSi                  # reference cell for MD, phonons and the forward+backward batch
  n_frames_8atom: 80              # (a) 8-atom frames: MPtrj B20 frames, cycled/rattled and zero-shot labelled beyond the source
  n_frames_64atom: 20             # (a) 2x2x2 supercells with MACE zero-shot labels (label_source mace_zero_shot)
  finetune_epochs: 2              # the last epoch is the measurement (epoch 0 carries warm-up)
  finetune_timeout_s: 3600
  md_natoms: [64, 512]            # (b) NVT Langevin at md.timestep_fs
  md_steps: 200
  md_warmup_steps: 10             # excluded from s/step
  md_T: 300.0
  n_relax: 20                     # (c) first ids of data/wbm/sample_1000_s0.json, eval.fmax / eval.max_steps
  phonon_supercell: 2             # (d) phonopy supercell (2 -> 2x2x2)
  phonon_distance: 0.03
  fwbw_batch: 4                   # (e) training-style forward + backward in a fresh process; peak RSS
  fwbw_natoms: 64
  fwbw_repeats: 3
