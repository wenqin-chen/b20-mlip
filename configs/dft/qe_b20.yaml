# Frozen production QE settings for every B20 frame (SPEC.md section 10, Day 3 "freeze qe_b20.yaml").
# Chosen 2026-09-19 from the four 24-point convergence scans on Tillicum (configs/dft/qe_<C>_converged.json,
# reference 90 Ry / k 0.20 1/A = 7x7x7 on the 8-atom cell; thresholds E <= 1 meV/atom, F <= 5 meV/A):
#   MnSi (GBRV USPP Mn): 80 Ry / k 0.20 meets both; forces need k <= 0.25 (6x6x6: 0.5-0.9 meV/A, 5x5x5: 6, 4x4x4: 13).
#   FeSi, FeGe (pslibrary PAW Fe): the absolute energy converges slowly with cutoff (80 Ry is still 6.5-7 meV/atom
#     above 90 Ry; SSSP efficiency 1.3 itself prescribes 90/1080 for Fe); forces are within 2-4 meV/A from 60 Ry.
#   CoSi (GBRV USPP Co): converged from 45 Ry per SSSP; k 0.20 kept for uniformity.
# One setting for the whole dataset keeps every frame on one energy scale (SPEC section 4, rule R1), so the maximum
# over compounds is used: 90/1080 Ry (dual 12) and k 0.20 1/A. Measured cost per 8-atom SCF on one H200 MIG slice
# (2 MPI ranks): FeSi 3m52s, CoSi 2m47s, MnSi ~5m, FeGe 5m12s.
# Usage: b20mlip --config configs/cluster/tillicum.yaml --config configs/dft/qe_b20.yaml dft prep|run|phonons|e0s ...
dft:
  ecut_ry: 90.0
  ecut_rho: 1080.0
  k_spacing_inv_A: 0.20
  smearing: mv
  degauss_ry: 0.01
  conv_thr: 1.0e-8
  mixing_beta: 0.3          # softer than the scans' 0.4: SPEC section 11 FM fallback; the unit script's cg retry covers the rest
  electron_maxstep: 200
