# Tillicum (UW Hyak) overlay: `b20mlip --config configs/cluster/tillicum.yaml ...`
# PLACEHOLDER — account, partitions, QOS, scratch and modules are discovered by
# `b20mlip cluster bootstrap` (SPEC.md section 8, docs/CLUSTER.md) after the user opens the
# ControlMaster socket with `ssh -fN tillicum` (MFA). Until then every discovered field is null
# and SlurmExecutor refuses to submit (cluster.scratch unset). Bootstrap rewrites only the values
# below (comments survive); an ambiguous discovery stays null with the candidates in its comment.
# last discovered: 2026-09-19T07:14:15Z by `b20mlip cluster bootstrap` run 20260919T071343-d01f59-none
cluster:
  alias: tillicum
  control_path: ~/.ssh/tillicum-cm
  account: stf             # discovered: hyakalloc / sacctmgr show assoc user=$USER
  partition_cpu: gpu-h200-mig # discovered: sinfo (unique partition without GPU GRES; Tillicum has none)
  partition_gpu: gpu-h200  # discovered: sinfo (unique partition with gpu/h200 GRES; else null)
  qos: normal              # discovered: the association's DefaultQOS (sacctmgr)
  scratch: /gpfs/projects/stf/wenqin98 # discovered: $SCRATCH, /gpfs/projects/<acct>/$USER, /gpfs/scrubbed/$USER, /gscratch/...
  modules: [gcc/13.4.0, cuda/12.8.2, cmake/3.31.8, openmpi/5.0.10] # discovered: gcc, cuda, cmake, openmpi (+ quantum-espresso when a module exists)
  qe_cmd: /gpfs/projects/stf/wenqin98/qe/bin/mpirun -np 2 --bind-to none --mca pml ob1 --mca btl self,sm /gpfs/projects/stf/wenqin98/qe/bin/pw.x -nk 2 # micromamba qe=7.5; ob1/sm: the default UCX transport silently corrupted CoSi SCFs (2026-09-19); -np = resources.qe_array.ntasks
  lammps_cmd: /gpfs/projects/stf/wenqin98/b20-mlip/bin/lmp # submitted (job 303455)
  micromamba_env: /gpfs/projects/stf/wenqin98/qe # micromamba QE fallback installed 2026-09-18
  resources:  # SLURM defaults per template; Tillicum allows <= 2 CPUs and <= 34 GB per GPU, 1 MIG slice = cheapest unit
    # 8-atom QE units: 2 MPI ranks on one MIG slice (5-6 min each); 64-atom phonon/vacancy units: 4 slices = 8 ranks
    qe_array: {ntasks: 2, cpus_per_task: 1, gpus: 1, mem: 30G, time: "00:45:00", max_parallel: 24}  # 8-atom SCF p50 6 min, p90 9 min, max 12+ min (low-symmetry cells: 172-260 k-points); 12 min timed out 179/265 units on 2026-09-19
    qe_phonons: {ntasks: 8, cpus_per_task: 1, gpus: 4, mem: 120G, time: "12:00:00", max_parallel: 8}
    train_replay: {gpus: 1, cpus_per_task: 2, mem: 48G, time: "02:00:00"}   # H200: round-0 B1 30 epochs ~ 10 min; B2 replay 10k frames x 20 epochs ~ 1 h
    lammps: {gpus: 1, cpus_per_task: 2, mem: 32G, time: "03:00:00"}

dft:
  # absolute cluster path of the SSSP efficiency 1.3.0 PBE UPF files (downloaded 2026-09-18 from
  # Materials Cloud record rcyfm-68h65 and md5-verified against configs/dft/sssp_efficiency_1.3_pbe.json)
  pseudo_dir: /gpfs/projects/stf/wenqin98/pseudos/sssp_efficiency_1.3.0_pbe
