# Tillicum (UW Hyak) overlay: `b20mlip --config configs/cluster/tillicum.yaml ...`
# PLACEHOLDER — account, partitions, scratch and modules are discovered by
# `b20mlip cluster bootstrap` (SPEC.md section 8) after the user opens the ControlMaster socket
# with `ssh -fN tillicum` (MFA). Until then every discovered field is null and SlurmExecutor
# refuses to submit (cluster.scratch unset).
cluster:
  alias: tillicum
  control_path: ~/.ssh/tillicum-cm
  account: null            # discovered: sacctmgr show assoc user=$USER
  partition_cpu: null      # discovered: sinfo
  partition_gpu: null      # H200 partition for replay/LAMMPS
  scratch: null            # discovered: $SCRATCH or /gscratch/...
  modules: []              # e.g. [gcc, openmpi, quantum-espresso]
  qe_cmd: null             # `module load ...; pw.x` or $SCRATCH/qe/bin/pw.x (micromamba fallback)
  lammps_cmd: null         # built by build_lammps_mace.sbatch (ACEsuit/lammps mace branch)
  micromamba_env: null
